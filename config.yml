# Testimonials (Abigail's words, 11 Oct 2026). Travellers rotate on the home page, listeners on the podcast page.
testimonials:
  - { quote: "I've just finished three months travelling around NZ in a camper and your Instagram helped us so much! It gave us so many inspirations/ideas of where to go... If I had a dollar for every time I said, \"this is on Abigail's Insta\"...", name: "Chloe, UK" }
  - { quote: "Had to message you because you inspired me to go to Rotorua! Was looking for a location up central north for a short trip next month and I wouldn't have even thought to go there if it hadn't been for your content making it look epic!!", name: "Jasmine, Wellington" }
listener_reviews:
  - { quote: "Finally had the time to listen to them on the plane home and enjoyed the first few, will listen to a few more on the long trip back down to Dunedin! It's fun to be listening to a travel podcast while travelling!", name: "Hannah, Dunedin" }
  - { quote: "Heck I love listening to all these podcast stories! Got me through my long boring drive yesterday!", name: "Shoshannah, Nelson" }
  - { quote: "So excited to listen to this! I'm in awe of how awesome your podcast is, I love hearing in more detail about trips around NZ and all the stories people have to tell. I can't wait to hear it each week!", name: "Laura, Christchurch" }
  - { quote: "Abigail is such a relatable person, you can't stop listening to her. Her podcast literally made me book my flight to Aotearoa and with her amazing map, we had a really stunning trip.", name: "Germany" }
  - { quote: "This is THE podcast to listen to if you're planning to visit New Zealand. I've learnt so much from Abigail's conversations with guests and my must-visit list is getting longer thanks to all the amazing destinations she introduces her listeners to. Can't wait for the next episode.", name: "Australia" }
  - { quote: "I absolutely love this podcast, it's my go-to when hiking or driving, so inspiring listening to all the great adventurers and their stories. An awesome space creating an adventurous community!", name: "Renee, West Coast" }

