name: One-off - copy old Squarespace images onto the site

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  localise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python3 tools/localise_images.py | tee localise.log
      - name: Commit images and updated posts
        run: |
          git config user.name "site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git add static/images/legacy content
          if ! git diff --cached --quiet; then
            git commit -m "Move old Squarespace-hosted images onto the site" -m "$(head -1 localise.log)"
            git push
            gh workflow run build.yml --ref main
          fi
        env:
          GH_TOKEN: ${{ github.token }}
