name: Build and deploy abigailhannah.nz

on:
  push:
    branches: [main]
  schedule:
    # Episodes publish Fridays 12:00 NZ time. Rebuild shortly after, in both NZDT and NZST, plus a daily catch-up.
    - cron: '15 23 * * 4'
    - cron: '15 0 * * 5'
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        id: pages
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      # WebP copies of every image are kept between builds, so only new or changed photos get encoded
      - name: Restore image cache
        uses: actions/cache/restore@v4
        with:
          path: imgcache
          key: imgcache-${{ hashFiles('static/images/**', 'content/**/*.md', 'imgopt.py') }}
          restore-keys: imgcache-
      - name: Build site (fetches the live podcast feed)
        run: python3 build.py
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
      - name: Save image cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: imgcache
          key: imgcache-${{ hashFiles('static/images/**', 'content/**/*.md', 'imgopt.py') }}-${{ github.run_id }}
      # nothing goes live unless these pass
      - name: Check links and anchors
        run: python3 tools/check_links.py
      - name: Check structured data and image files
        run: python3 tools/check_site.py
      - name: Commit refreshed feed snapshot
        run: |
          git config user.name "site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git add data/feed.xml
          if ! git diff --cached --quiet; then git commit -m "chore: refresh feed snapshot" && git push; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
